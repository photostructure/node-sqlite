<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 446" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>@photostructure/sqlite throughput vs node:sqlite</title>
  <rect width="680" height="446" fill="#fff" rx="6" />
  <text x="340" y="20" text-anchor="middle" font-size="15" font-weight="600" fill="#222">@photostructure/sqlite throughput vs node:sqlite</text>
  <text x="340" y="36" text-anchor="middle" font-size="11" fill="#888">ratio of ops/sec (1.0× = parity; higher is faster)</text>
  <line x1="168" y1="60" x2="168" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="236" y1="60" x2="236" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="304" y1="60" x2="304" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="372" y1="60" x2="372" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="440" y1="60" x2="440" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="508" y1="60" x2="508" y2="398" stroke="#ececec" stroke-width="1" />
  <line x1="576" y1="60" x2="576" y2="398" stroke="#ececec" stroke-width="1" />
  <text x="160" y="81" text-anchor="end" font-size="12" fill="#444">SELECT by Primary Key</text>
  <rect x="168" y="64" width="301.82" height="26" fill="#1B6B8A" rx="3" opacity="0.9" />
  <text x="475.82" y="81" font-size="11" fill="#555">0.89×</text>
  <text x="160" y="119" text-anchor="end" font-size="12" fill="#444">SELECT Range</text>
  <rect x="168" y="102" width="250.05" height="26" fill="#1B6B8A" rx="3" opacity="0.9" />
  <text x="424.05" y="119" font-size="11" fill="#555">0.74×</text>
  <text x="160" y="157" text-anchor="end" font-size="12" fill="#444">SELECT with Iterator</text>
  <rect x="168" y="140" width="158.84" height="26" fill="#1B6B8A" rx="3" opacity="0.9" />
  <text x="332.84" y="157" font-size="11" fill="#555">0.47×</text>
  <text x="160" y="195" text-anchor="end" font-size="12" fill="#444">INSERT Single Row †</text>
  <rect x="168" y="178" width="329.59" height="26" fill="#6B7280" rx="3" opacity="0.9" />
  <text x="503.59" y="195" font-size="11" fill="#555">0.97×</text>
  <text x="160" y="233" text-anchor="end" font-size="12" fill="#444">INSERT in Transaction ‡</text>
  <rect x="168" y="216" width="283.51" height="26" fill="#C2681E" rx="3" opacity="0.9" />
  <text x="457.51" y="233" font-size="11" fill="#555">0.83×</text>
  <text x="160" y="271" text-anchor="end" font-size="12" fill="#444">SELECT with JOIN</text>
  <rect x="168" y="254" width="293.73" height="26" fill="#1B6B8A" rx="3" opacity="0.9" />
  <text x="467.73" y="271" font-size="11" fill="#555">0.86×</text>
  <text x="160" y="309" text-anchor="end" font-size="12" fill="#444">INSERT with BLOB †</text>
  <rect x="168" y="292" width="336.82" height="26" fill="#6B7280" rx="3" opacity="0.9" />
  <text x="510.82" y="309" font-size="11" fill="#555">0.99×</text>
  <text x="160" y="347" text-anchor="end" font-size="12" fill="#444">UPDATE with Index †</text>
  <rect x="168" y="330" width="339.81" height="26" fill="#6B7280" rx="3" opacity="0.9" />
  <text x="513.81" y="347" font-size="11" fill="#555">1.00×</text>
  <text x="160" y="385" text-anchor="end" font-size="12" fill="#444">DELETE Bulk ‡</text>
  <rect x="168" y="368" width="285.55" height="26" fill="#C2681E" rx="3" opacity="0.9" />
  <text x="459.55" y="385" font-size="11" fill="#555">0.84×</text>
  <line x1="508" y1="60" x2="508" y2="398" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" />
  <text x="508" y="56" text-anchor="middle" font-size="10" fill="#c0392b">node:sqlite = 1.0×</text>
  <text x="168" y="412" text-anchor="middle" font-size="10" fill="#999">0</text>
  <text x="236" y="412" text-anchor="middle" font-size="10" fill="#999">0.2</text>
  <text x="304" y="412" text-anchor="middle" font-size="10" fill="#999">0.4</text>
  <text x="372" y="412" text-anchor="middle" font-size="10" fill="#999">0.6</text>
  <text x="440" y="412" text-anchor="middle" font-size="10" fill="#999">0.8</text>
  <text x="508" y="412" text-anchor="middle" font-size="10" fill="#999">1</text>
  <text x="576" y="412" text-anchor="middle" font-size="10" fill="#999">1.2</text>
  <rect x="168" y="415" width="11" height="11" fill="#1B6B8A" rx="2" />
  <text x="184" y="424" font-size="10" fill="#666">read</text>
  <rect x="228" y="415" width="11" height="11" fill="#6B7280" rx="2" />
  <text x="244" y="424" font-size="10" fill="#666">single-op write (†)</text>
  <rect x="378" y="415" width="11" height="11" fill="#C2681E" rx="2" />
  <text x="394" y="424" font-size="10" fill="#666">batched write (‡)</text>
</svg>