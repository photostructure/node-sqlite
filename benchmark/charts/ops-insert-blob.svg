  <text x="578.18" y="81" font-size="11" fill="#555">390 ops/s</text>
  <text x="160" y="119" text-anchor="end" font-size="12" fill="#444">better-sqlite3</text>
  <rect x="168" y="102" width="404.86" height="26" fill="#B8860B" rx="3" opacity="0.9" />
