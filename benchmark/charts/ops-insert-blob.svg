<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 196" role="img" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>INSERT with BLOB</title>
  <rect width="680" height="196" fill="#fff" rx="6" />
