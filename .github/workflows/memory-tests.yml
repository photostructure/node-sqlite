name: Memory Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Comprehensive memory tests - all platforms and Node versions
  memory-tests:
    strategy:
      fail-fast: false # Don't cancel other jobs if one fails
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24, 26]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind build-essential clang

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          # The runner image's cached Node.js can be an older release, and
          # 24.0.0-24.21.0 can crash Jest workers in GC (nodejs/node#62393).
          check-latest: true
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build native and javascript bundle
        run: npm run build

      - name: Run comprehensive memory tests
        run: npm run memory:check

      - name: Upload memory test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-test-logs-${{ matrix.os }}-${{ matrix.node-version }}
          path: |
            asan-test.log
            valgrind.log
            asan-output.log
            mem-job-logs.txt
          if-no-files-found: ignore
