# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 8
    # Group action updates to reduce PR noise and review burden
    groups:
      actions:
        patterns:
          - "*"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 8
    # Limit open PRs to prevent overwhelming and reduce attack surface
    open-pull-requests-limit: 5
    # Group updates to reduce attack surface from multiple PRs
    groups:
      production:
        dependency-type: "production"
      development:
        dependency-type: "development"
